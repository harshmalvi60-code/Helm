<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Start free trial · HELM</title>
<meta name="description" content="Start your 14-day HELM free trial. Connect Shopify, Meta, GA4 — get AI insights in minutes." />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body class="app-bg">

<div class="aurora"></div>

<main class="auth-wrap">
  <div class="auth-card">
    <a href="/" class="auth-logo"><span class="mark"></span><span>HELM</span></a>
    <h1>Start your free trial</h1>
    <p class="subtitle">14 days free · No credit card · Cancel anytime.</p>

    <div id="alert" class="hidden"></div>

    <form id="signupForm" autocomplete="on">
      <div class="form-group">
        <label class="form-label" for="brand">Brand name</label>
        <input class="form-input" type="text" id="brand" name="brand" required placeholder="Acme Coffee Co." />
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Work email</label>
        <input class="form-input" type="email" id="email" name="email" required autocomplete="email" placeholder="founder@brand.com" />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password" required autocomplete="new-password" placeholder="At least 8 characters" minlength="8" />
        <div class="form-hint">8+ characters. Use a mix of letters and numbers.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Create account →</button>
    </form>

    <div class="auth-divider">or continue with</div>
    <button class="btn btn-subtle btn-block" id="googleBtn" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3a12 12 0 1 1-3.3-13.6l5.7-5.7A20 20 0 1 0 44 24c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8A12 12 0 0 1 24 16c3 0 5.7 1.1 7.8 3l5.7-5.7A20 20 0 0 0 6.3 14.7z"/><path fill="#4CAF50" d="M24 44a20 20 0 0 0 13.5-5.2l-6.2-5.2A12 12 0 0 1 12.7 28L6 33.3A20 20 0 0 0 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.2 5.2A20 20 0 0 0 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
      Sign up with Google
    </button>

    <p class="auth-foot">Already have an account? <a href="/login">Sign in</a></p>
    <p class="text-tertiary text-xs text-center" style="margin-top:14px;line-height:1.6;">
      By signing up you agree to HELM's <a href="#" style="color:var(--text-secondary);">Terms</a> and <a href="#" style="color:var(--text-secondary);">Privacy Policy</a>.
    </p>
  </div>
</main>

<script src="/assets/js/supabase.js"></script>
<script src="/assets/js/ui.js"></script>
<script>
(async function () {
  const form = document.getElementById('signupForm');
  const btn = document.getElementById('submitBtn');
  const alertBox = document.getElementById('alert');

  const user = await window.HelmSupabase.currentUser();
  if (user) { location.href = '/dashboard'; return; }

  const prefillEmail = window.HelmUI.getParam('email');
  if (prefillEmail) document.getElementById('email').value = prefillEmail;

  function show(type, msg) {
    alertBox.className = 'form-' + type;
    alertBox.textContent = msg;
    alertBox.classList.remove('hidden');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.classList.add('hidden');
    const brand = document.getElementById('brand').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Creating account…';
    try {
      const sb = await window.HelmSupabase.getClient();
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { brand_name: brand, full_name: email.split('@')[0] } },
      });
      if (error) throw error;

      try {
        const uid = data?.user?.id;
        if (uid) {
          await sb.from('organizations').insert({ user_id: uid, name: brand });
          await sb.from('subscriptions').insert({
            user_id: uid, plan: 'starter', status: 'trialing',
            trial_ends_at: new Date(Date.now() + 14 * 86400000).toISOString(),
          });
        }
      } catch (_) {}

      if (!data?.session) {
        show('success', 'Account created. Check your inbox to confirm your email.');
        btn.textContent = 'Account created';
        return;
      }
      window.HelmUI.toast('Welcome to HELM', 'success', 1300);
      setTimeout(() => { location.href = '/onboarding'; }, 300);
    } catch (err) {
      show('error', err.message || 'Could not create account');
      btn.disabled = false;
      btn.textContent = 'Create account →';
    }
  });

  document.getElementById('googleBtn').addEventListener('click', async () => {
    const sb = await window.HelmSupabase.getClient();
    await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/onboarding' } });
  });
})();
</script>
</body>
</html>
